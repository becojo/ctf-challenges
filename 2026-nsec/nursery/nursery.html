      <div>
        <button id="prev">Previous</button>
        <button id="next">Next</button>
      </div>
    </div>
    <script>(function main() {
  let currentIndex = 0, ids = Array.from(document.querySelectorAll("img.sample")).map((img) => img.getAttribute("data-id"));
  document.getElementById("prev").onclick = () => {
    if (currentIndex > 0)
      currentIndex -= 1;
    update();
  };
  document.getElementById("next").onclick = () => {
    if (currentIndex < ids.length - 1)
      currentIndex += 1;
    update();
  };
  function update() {
    document.querySelectorAll("img.sample").forEach((img) => img.style.display = "none");
    var id = ids[currentIndex];
    document.getElementById("number").innerText = id;
    var img = document.querySelector(`img.sample[data-id='${id}']`);
    img.style.display = "block";
  }
  update();
})();</script>
