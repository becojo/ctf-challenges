<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParrotLM Chat</title>
  <script>
    document.documentElement.classList.add('js');
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #edf1ec;
      --panel: rgba(248, 246, 241, 0.88);
      --panel-strong: #f8f6f1;
      --border: rgba(38, 32, 20, 0.12);
      --text: #1e2016;
      --muted: #6b6e5d;
      --brand: #3a7d44;
      --brand-strong: #2e6337;
      --shadow: 0 28px 80px rgba(16, 24, 10, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(58, 125, 68, 0.14), transparent 38%),
        linear-gradient(180deg, #f4f2ec 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .shell {
      width: min(100%, 920px);
      height: min(86vh, 760px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: linear-gradient(135deg, #1e2a18, #2d4024 45%, #3a7d44);
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand p {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.74);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .status {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
      backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        0 10px 28px rgba(7, 14, 30, 0.18);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      isolation: isolate;
      white-space: nowrap;
    }

    .status-action {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      color: #fff;
      padding: 0.45rem 0.8rem;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .status-action:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(255, 255, 255, 0.14);
    }

    .status-action:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(141, 240, 176, 0.28);
    }

    .status::after {
      content: '';
      position: absolute;
      inset: -35%;
      background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
      transform: translateX(-55%) rotate(8deg);
      animation: status-sheen 4.8s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    .status::before {
      content: '';
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 999px;
      background: #8df0b0;
      box-shadow:
        0 0 0 6px rgba(141, 240, 176, 0.14),
        0 0 18px rgba(141, 240, 176, 0.7);
      animation: status-pulse 2.2s ease-in-out infinite;
    }

    @keyframes status-pulse {
      0%, 100% {
        transform: scale(0.96);
        box-shadow:
          0 0 0 6px rgba(141, 240, 176, 0.1),
          0 0 14px rgba(141, 240, 176, 0.5);
      }

      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 0 10px rgba(141, 240, 176, 0.04),
          0 0 24px rgba(141, 240, 176, 0.82);
      }
    }

    .api-key-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      width: min(92vw, 30rem);
      border: 1px solid rgba(38, 32, 20, 0.12);
      border-radius: 22px;
      padding: 0;
      background: rgba(248, 246, 241, 0.98);
      color: var(--text);
      box-shadow: 0 30px 90px rgba(16, 24, 10, 0.28);
    }

    .api-key-dialog::backdrop {
      background: rgba(14, 18, 10, 0.52);
      backdrop-filter: blur(4px);
    }

    .api-key-dialog-inner {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1.1rem;
    }

    .api-key-dialog-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 1rem;
    }

    .api-key-dialog-header h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .api-key-dialog-header p {
      margin-top: 0.25rem;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .api-key-dialog-close {
      appearance: none;
      border: 1px solid rgba(38, 32, 20, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--muted);
      width: 2rem;
      height: 2rem;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      flex: 0 0 auto;
    }

    .api-key-dialog-close:hover {
      background: #fff;
      color: var(--text);
    }

    .api-key-form {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .api-key-form input {
      width: 100%;
      padding: 0.8rem 0.95rem;
      border: 1px solid rgba(38, 32, 20, 0.16);
      border-radius: 14px;
      background: rgba(250, 248, 244, 0.92);
      color: var(--text);
      font-size: 0.95rem;
    }

    .api-key-form input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 4px rgba(58, 125, 68, 0.14);
    }

    .api-key-form-actions {
      display: flex;
      gap: 0.65rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .api-key-form button {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 14px;
      min-width: 7rem;
      background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(58, 125, 68, 0.22);
    }

    .api-key-form button.secondary {
      background: rgba(38, 32, 20, 0.08);
      color: var(--text);
      box-shadow: none;
    }

    @keyframes status-sheen {
      0%, 100% {
        transform: translateX(-55%) rotate(8deg);
        opacity: 0;
      }

      18%, 62% {
        opacity: 0;
      }

      34% {
        transform: translateX(10%) rotate(8deg);
        opacity: 0.7;
      }

      46% {
        transform: translateX(55%) rotate(8deg);
        opacity: 0;
      }
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      background: linear-gradient(180deg, rgba(244,242,236,0.18), rgba(237,241,236,0.06));
    }

    .message {
      max-width: min(70%, 38rem);
      padding: 0.85rem 1rem;
      border-radius: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      opacity: 1;
      transform: translate3d(0, 0, 0);
      transition: opacity 220ms ease, transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .message-stack {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      max-width: min(70%, 38rem);
      width: fit-content;
    }

    .message-stack.user-stack {
      align-self: flex-end;
      align-items: flex-end;
    }

    .js .message.is-entering:not(.is-visible) {
      opacity: 0;
    }

    .js .message.user.is-entering:not(.is-visible) {
      transform: translate3d(20px, 10px, 0);
    }

    .js .message.model.is-entering:not(.is-visible),
    .js .message.thought.is-entering:not(.is-visible) {
      transform: translate3d(-20px, 10px, 0);
    }

    .message.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .message p {
      margin: 0 0 0.8rem;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .message.user::before,
    .message.model::before {
      display: block;
      margin-bottom: 0.28rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      opacity: 0.72;
    }

    .message.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
    .message-stack.user-stack .message.user { align-self: stretch; max-width: 100%; }
    .message.user::before { content: 'User'; color: rgba(255, 255, 255, 0.88); }
    .message.model { align-self: flex-start; background: var(--panel-strong); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 6px; }
    .message.model::before { content: 'ParrotLM 🦜'; color: var(--muted); }
    .message.thought { align-self: flex-start; background: rgba(30, 40, 22, 0.05); border: 1px solid var(--border); color: var(--muted); font-style: italic; font-size: 0.875rem; border-bottom-left-radius: 6px; }
    .message.thought::before { content: 'Thinking 💭'; color: var(--muted); font-style: normal; font-weight: 600; opacity: 0.72; }

    .share-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      min-height: 1.65rem;
      border: 1px solid rgba(38, 32, 20, 0.18);
      border-radius: 999px;
      background: rgba(248, 246, 241, 0.9);
      color: var(--brand-strong);
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
      padding: 0.2rem 0.58rem;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
    }

    .share-link-btn .icon {
      font-size: 0.86rem;
    }

    .share-link-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(58, 125, 68, 0.45);
      background: #fff;
    }

    .share-link-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(58, 125, 68, 0.22);
    }

    .share-link-btn.copied {
      border-color: rgba(58, 125, 68, 0.5);
      background: rgba(58, 125, 68, 0.14);
    }

    #form {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 1.25rem 1.25rem;
      background: rgba(244, 242, 236, 0.7);
      border-top: 1px solid var(--border);
    }

    #input {
      flex: 1;
      padding: 0.8rem 1rem;
      border: 1px solid rgba(38, 32, 20, 0.16);
      border-radius: 14px;
      font-size: 1rem;
      background: rgba(250, 248, 244, 0.92);
      color: var(--text);
    }

    #input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px rgba(58, 125, 68, 0.14); }
    #send {
      padding: 0.8rem 1.2rem;
      background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      box-shadow: 0 10px 24px rgba(58, 125, 68, 0.28);
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

    @media (max-width: 720px) {
      body { padding: 0.75rem; }
      .shell { width: 100%; height: calc(100vh - 1.5rem); border-radius: 18px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .status { width: fit-content; }
      .message { max-width: 88%; }
      .message-stack { max-width: 88%; }
      #form { flex-direction: column; }
      #send { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="ParrotLM Chat">
    <header class="topbar">
      <div class="brand">
        <h1>🦜 ParrotLM Chat</h1>
        <p>Your AI companion, always ready to chirp.</p>
      </div>
      <div class="topbar-actions">
        <button id="open-api-key" class="status-action" type="button" aria-haspopup="dialog" aria-controls="api-key-dialog">Configure API key</button>
        <div class="status">Online</div>
      </div>
    </header>
    <div id="messages"><!-- messages --></div>
    <form id="form">
      <input id="input" type="text" placeholder="Ask something..." autocomplete="off" />
      <button type="submit" id="send">Send</button>
    </form>
  </main>
  <dialog id="api-key-dialog" class="api-key-dialog" aria-labelledby="api-key-title">
    <div class="api-key-dialog-inner">
      <div class="api-key-dialog-header">
        <div>
          <h2 id="api-key-title">Configure API key</h2>
          <p>Save a custom key to your browser cookie for authenticated requests. Leave empty to use free credits.</p>
        </div>
        <button class="api-key-dialog-close" type="button" data-close-dialog aria-label="Close">×</button>
      </div>
      <form class="api-key-form" action="/api-key" method="post">
        <input id="api_key" name="api_key" type="password" placeholder="Enter API key" autocomplete="off" spellcheck="false" />
        <div class="api-key-form-actions">
          <button class="secondary" type="button" data-close-dialog>Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </dialog>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const messages = document.getElementById('messages');
    const openApiKeyButton = document.getElementById('open-api-key');
    const apiKeyDialog = document.getElementById('api-key-dialog');
    const MESSAGE_DELAYS = {
      user: 120,
      thought: 700,
      model: 420,
    };
    let renderQueue = Promise.resolve();

    function wait(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function revealMessage(div, cls) {
      const delay = MESSAGE_DELAYS[cls] ?? 180;
      const task = renderQueue.then(async () => {
        await wait(delay);
        messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
        window.requestAnimationFrame(() => {
          div.classList.add('is-visible');
        });
        return div;
      });

      renderQueue = task.then(() => undefined, () => undefined);
      return task;
    }

    function buildPromptShareLink(promptText) {
      const shareUrl = new URL('/', window.location.origin);
      shareUrl.searchParams.set('prompt', promptText);
      return shareUrl.toString();
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
    }

    function closeApiKeyDialog() {
      if (apiKeyDialog.open) {
        apiKeyDialog.close();
      }
    }

    openApiKeyButton.addEventListener('click', () => {
      apiKeyDialog.showModal();
      apiKeyDialog.querySelector('#api_key').focus();
    });

    apiKeyDialog.addEventListener('click', (event) => {
      if (event.target === apiKeyDialog) {
        closeApiKeyDialog();
      }
    });

    apiKeyDialog.querySelectorAll('[data-close-dialog]').forEach((button) => {
      button.addEventListener('click', closeApiKeyDialog);
    });

    function createShareButton(promptText) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'share-link-btn';
      button.innerHTML = '<span class="icon" aria-hidden="true">🔗</span><span>Share</span>';
      button.title = 'Copy share link';
      button.setAttribute('aria-label', 'Copy share link');

      button.addEventListener('click', async () => {
        const link = buildPromptShareLink(promptText);

        try {
          await copyText(link);
          button.classList.add('copied');
          const originalTitle = button.title;
          const originalLabel = button.innerHTML;
          button.title = 'Copied!';
          button.innerHTML = '<span class="icon" aria-hidden="true">✓</span><span>Copied!</span>';
          window.setTimeout(() => {
            button.classList.remove('copied');
            button.title = originalTitle;
            button.innerHTML = originalLabel;
          }, 1200);
        } catch {
          button.title = link;
        }
      });

      return button;
    }

    function addMessage(content, cls) {
      const div = document.createElement('div');
      div.className = `message ${cls} is-entering`;
      if (content && typeof content === 'object' && 'html' in content) {
        div.innerHTML = content.html || '';
      } else {
        div.textContent = typeof content === 'string'
          ? content
          : content?.text || '';
      }

      if (cls === 'user') {
        const stack = document.createElement('div');
        stack.className = 'message-stack user-stack';
        stack.appendChild(div);

        const rawPrompt = typeof content === 'string'
          ? content
          : content?.text || '';
        stack.appendChild(createShareButton(rawPrompt));
        messages.appendChild(stack);
      } else {
        messages.appendChild(div);
      }

      return revealMessage(div, cls);
    }

    function getMessageClass(div) {
      if (div.classList.contains('user')) return 'user';
      if (div.classList.contains('thought')) return 'thought';
      return 'model';
    }

    function revealExistingMessages() {
      for (const div of messages.querySelectorAll('.message')) {
        div.classList.add('is-entering');
        revealMessage(div, getMessageClass(div));
      }
    }

    revealExistingMessages();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;
      input.value = '';
      send.disabled = true;

      addMessage(prompt, 'user');

      const url = `/chat.sse.json?prompt=${encodeURIComponent(prompt)}`;
      const es = new EventSource(url);
      let modelDivPromise = null;

      es.onmessage = async (event) => {
        const parsed = JSON.parse(event.data);
        if (parsed.done) {
          es.close();
          send.disabled = false;
          return;
        }
        const data = parsed.data;
        if (data.thought) {
          await addMessage(data, 'thought');
        } else {
          if (!modelDivPromise) {
            modelDivPromise = addMessage(data, 'model');
          } else {
            const modelDiv = await modelDivPromise;
            modelDiv.innerHTML += data.html || '';
            messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
          }
        }
      };

      es.onerror = () => {
        es.close();
        send.disabled = false;
      };
    });
  </script>
</body>
</html>
